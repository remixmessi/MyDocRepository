services:
  mydoc:
    image: mydoc-web:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${MYDOC_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${MYDOC_DATA_DIR:-/opt/1panel/apps/mydoc/data}
        target: /app/data
        bind:
          create_host_path: false
    environment:
      MYDOC_INIT_DATABASE: ${MYDOC_INIT_DATABASE:-0}
    # To initialize a server administrator, uncomment and replace both values.
    # Add under environment above:
    #   MYDOC_ADMIN_EMAIL: admin@example.com
    #   MYDOC_ADMIN_PASSWORD: replace-with-a-strong-password
    #   MYDOC_ADMIN_NAME: Administrator
