name: Desktop builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/**'
      - 'scripts/build-desktop.mjs'
      - 'scripts/desktop/**'
      - 'tests/desktop/**'
      - 'tests/*desktop*.test.ts'
      - 'tests/database-backups.test.ts'
      - 'tests/sqlite-storage.test.ts'
      - 'tests/fixtures/pdf-preview.pdf'
      - 'vitest.config.ts'
      - 'playwright.desktop.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/build-desktop.mjs'
      - 'scripts/desktop/**'
      - 'tests/desktop/**'
      - 'tests/*desktop*.test.ts'
      - 'tests/database-backups.test.ts'
      - 'tests/sqlite-storage.test.ts'
      - 'tests/fixtures/pdf-preview.pdf'
      - 'vitest.config.ts'
      - 'playwright.desktop.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: node node_modules/electron/install.js
      - run: corepack yarn typecheck
      - run: corepack yarn test
      - run: node --test scripts/desktop/mac-architecture.test.mjs scripts/desktop/mac-identity.test.mjs
      - run: corepack yarn desktop:build
      - run: corepack yarn test:desktop
      - if: runner.os == 'macOS'
        run: corepack yarn workspace @mydoc/desktop dist:mac --${{ matrix.arch }} --publish never
      - if: runner.os == 'Windows'
        run: corepack yarn workspace @mydoc/desktop dist:win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MyDoc-${{ runner.os }}-${{ matrix.arch }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/*.blockmap
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ runner.os }}-${{ matrix.arch }}
          path: test-results/
