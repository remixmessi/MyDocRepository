name: Desktop builds
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: ['**']
    tags: ['v*', '[0-9]*']
    paths:
      - 'packages/**'
      - 'scripts/build-desktop.mjs'
      - 'scripts/desktop/**'
      - 'tests/desktop/**'
      - 'tests/*desktop*.test.ts'
      - 'tests/database-backups.test.ts'
      - 'tests/sqlite-storage.test.ts'
      - 'tests/fixtures/pdf-preview.pdf'
      - 'vitest.config.ts'
      - 'playwright.desktop.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/build-desktop.mjs'
      - 'scripts/desktop/**'
      - 'tests/desktop/**'
      - 'tests/*desktop*.test.ts'
      - 'tests/database-backups.test.ts'
      - 'tests/sqlite-storage.test.ts'
      - 'tests/fixtures/pdf-preview.pdf'
      - 'vitest.config.ts'
      - 'playwright.desktop.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!tag) process.exit(0);
          const { version } = JSON.parse(readFileSync('packages/frontend/apps/desktop/package.json', 'utf8'));
          if (!/^v?\d+\.\d+\.\d+$/.test(tag) || tag.replace(/^v/, '') !== version) {
            throw new Error(`Release tag ${tag} must match desktop version ${version} (v${version} or ${version}).`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `release_tag=${tag}\n`);
          NODE
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: node node_modules/electron/install.js
      - run: corepack yarn typecheck
      - run: corepack yarn test
      - run: node --test scripts/desktop/mac-architecture.test.mjs scripts/desktop/mac-identity.test.mjs
      - run: corepack yarn desktop:build
      - run: corepack yarn test:desktop
      - if: runner.os == 'macOS'
        run: corepack yarn workspace @mydoc/desktop dist:mac --${{ matrix.arch }} --publish never
      - if: runner.os == 'Windows'
        run: corepack yarn workspace @mydoc/desktop dist:win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MyDoc-${{ runner.os }}-${{ matrix.arch }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/*.blockmap
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ runner.os }}-${{ matrix.arch }}
          path: test-results/
  publish:
    name: Attach installers to GitHub Release
    needs: [prepare, desktop]
    if: github.event_name == 'release' && github.event.action == 'published' && needs.prepare.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MyDoc-*
          merge-multiple: true
          path: release-assets
      - name: Check installers and generate checksums
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for asset in "MyDoc-$version-mac-arm64.dmg" "MyDoc-$version-mac-x64.dmg" "MyDoc-$version-win-x64.exe"; do
            test -s "release-assets/$asset" || { echo "Missing installer: $asset"; exit 1; }
          done
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - name: Upload to manually published release
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
